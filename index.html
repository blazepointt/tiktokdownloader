<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Video Downloader</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-cyan: #25f4ee;
            --primary-pink: #ff0050;
            --dark-bg: #0f0f0f;
            --card-bg: #1a1a1a;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --border-color: #333333;
            --glow-cyan: 0 0 20px rgba(37, 244, 238, 0.3);
            --glow-pink: 0 0 20px rgba(255, 0, 80, 0.3);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #0f0f0f 0%, #1a0a2e 50%, #16213e 100%);
            background-attachment: fixed;
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 10px;
            background: linear-gradient(135deg, var(--primary-cyan), var(--primary-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 20px rgba(37, 244, 238, 0.2);
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .input-section {
            margin-bottom: 30px;
            display: flex;
            gap: 12px;
            animation: slideUp 0.6s ease-out 0.1s both;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .input-wrapper {
            flex: 1;
            position: relative;
        }

        #videoUrl {
            width: 100%;
            padding: 16px 20px;
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 16px;
            transition: all 0.3s ease;
            outline: none;
        }

        #videoUrl:focus {
            border-color: var(--primary-cyan);
            box-shadow: var(--glow-cyan);
        }

        #videoUrl::placeholder {
            color: var(--text-secondary);
        }

        .download-btn {
            padding: 16px 32px;
            background: linear-gradient(135deg, var(--primary-cyan), var(--primary-pink));
            border: none;
            border-radius: 12px;
            color: #000;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
            position: relative;
            overflow: hidden;
            box-shadow: var(--glow-cyan);
        }

        .download-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s;
        }

        .download-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: var(--glow-cyan), var(--glow-pink);
        }

        .download-btn:hover:not(:disabled)::before {
            left: 100%;
        }

        .download-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(0, 0, 0, 0.3);
            border-top: 2px solid #000;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .content-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 30px;
            animation: slideUp 0.6s ease-out 0.2s both;
        }

        @media (max-width: 768px) {
            .content-section {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: rgba(26, 26, 26, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            opacity: 0;
            pointer-events: none;
        }

        .card.active {
            opacity: 1;
            pointer-events: all;
        }

        .card:hover {
            border-color: var(--primary-cyan);
            box-shadow: var(--glow-cyan);
        }

        .author-info {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
        }

        .author-avatar {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--primary-cyan);
            box-shadow: var(--glow-cyan);
        }

        .author-details h3 {
            color: var(--primary-cyan);
            font-size: 18px;
            margin-bottom: 4px;
            word-break: break-all;
        }

        .author-details p {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .video-description {
            color: var(--text-primary);
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 16px;
            padding: 12px;
            background: rgba(0, 0, 0, 0.3);
            border-left: 3px solid var(--primary-pink);
            border-radius: 4px;
        }

        .stats {
            display: flex;
            gap: 16px;
            margin-top: 16px;
            font-size: 14px;
        }

        .stat {
            display: flex;
            flex-direction: column;
        }

        .stat-value {
            color: var(--primary-cyan);
            font-weight: bold;
            font-size: 18px;
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 12px;
            margin-top: 4px;
        }

        .video-player {
            position: relative;
            width: 100%;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            aspect-ratio: 9 / 16;
        }

        .video-player video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .download-links {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .download-link {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: rgba(37, 244, 238, 0.1);
            border: 1px solid var(--primary-cyan);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .download-link:hover {
            background: rgba(37, 244, 238, 0.2);
            transform: translateX(4px);
        }

        .download-link-btn {
            padding: 6px 12px;
            background: var(--primary-cyan);
            border: none;
            border-radius: 6px;
            color: #000;
            font-weight: 600;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s ease;
        }

        .download-link-btn:hover {
            transform: scale(1.05);
            box-shadow: var(--glow-cyan);
        }

        .error-message {
            padding: 16px 20px;
            background: rgba(255, 0, 80, 0.1);
            border: 2px solid var(--primary-pink);
            border-radius: 12px;
            color: var(--primary-pink);
            margin-top: 20px;
            animation: slideUp 0.3s ease-out;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .success-message {
            padding: 16px 20px;
            background: rgba(37, 244, 238, 0.1);
            border: 2px solid var(--primary-cyan);
            border-radius: 12px;
            color: var(--primary-cyan);
            margin-top: 20px;
            animation: slideUp 0.3s ease-out;
            display: none;
        }

        .success-message.show {
            display: block;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .blur-bg {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 20% 50%, rgba(37, 244, 238, 0.1) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(255, 0, 80, 0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: -1;
        }

        .loader-ring {
            display: inline-block;
            position: relative;
            width: 20px;
            height: 20px;
        }

        .loader-ring div {
            box-sizing: border-box;
            display: block;
            position: absolute;
            width: 16px;
            height: 16px;
            margin: 2px;
            border: 2px solid currentColor;
            border-radius: 50%;
            animation: loader-ring 1.2s cubic-bezier(0.5, 0, 0.5, 1);
        }

        .loader-ring div:nth-child(1) {
            animation-delay: -0.45s;
        }

        .loader-ring div:nth-child(2) {
            animation-delay: -0.3s;
        }

        .loader-ring div:nth-child(3) {
            animation-delay: -0.15s;
        }

        @keyframes loader-ring {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>
    <div class="blur-bg"></div>
    
    <div class="container">
        <div class="header">
            <div class="logo">🎵 TikTok Downloader</div>
            <div class="subtitle">Скачивай видео без водяного знака</div>
        </div>

        <div class="input-section">
            <div class="input-wrapper">
                <input 
                    type="text" 
                    id="videoUrl" 
                    placeholder="Вставь ссылку на видео TikTok... https://www.tiktok.com/@..."
                >
            </div>
            <button class="download-btn" id="downloadBtn">
                <span>Скачать</span>
            </button>
        </div>

        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>

        <div class="content-section">
            <!-- Author Info Card -->
            <div class="card" id="authorCard">
                <div class="author-info">
                    <img id="authorAvatar" class="author-avatar" src="" alt="Author">
                    <div class="author-details">
                        <h3 id="authorName">@username</h3>
                        <p id="authorSignature"></p>
                    </div>
                </div>
                <div class="video-description" id="videoDesc"></div>
                <div class="stats">
                    <div class="stat">
                        <span class="stat-value" id="likeCount">0</span>
                        <span class="stat-label">Лайки</span>
                    </div>
                    <div class="stat">
                        <span class="stat-value" id="commentCount">0</span>
                        <span class="stat-label">Комментарии</span>
                    </div>
                    <div class="stat">
                        <span class="stat-value" id="shareCount">0</span>
                        <span class="stat-label">Поделились</span>
                    </div>
                </div>
            </div>

            <!-- Video Player Card -->
            <div class="card" id="playerCard">
                <div class="video-player">
                    <video id="videoPlayer" controls></video>
                </div>
                <div class="download-links" id="downloadLinks"></div>
            </div>
        </div>
    </div>

    <script>
        const videoUrlInput = document.getElementById('videoUrl');
        const downloadBtn = document.getElementById('downloadBtn');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');
        const authorCard = document.getElementById('authorCard');
        const playerCard = document.getElementById('playerCard');

        // Форматирование больших чисел
        function formatNumber(num) {
            if (num >= 1000000) {
                return (num / 1000000).toFixed(1) + 'M';
            } else if (num >= 1000) {
                return (num / 1000).toFixed(1) + 'K';
            }
            return num;
        }

        // Показ ошибки
        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
            setTimeout(() => {
                errorMessage.classList.remove('show');
            }, 5000);
        }

        // Показ успеха
        function showSuccess(message) {
            successMessage.textContent = message;
            successMessage.classList.add('show');
            setTimeout(() => {
                successMessage.classList.remove('show');
            }, 3000);
        }

        // Скрытие карточек
        function hideCards() {
            authorCard.classList.remove('active');
            playerCard.classList.remove('active');
        }

        // Форматирование ссылки TikTok
        function getTikTokId(url) {
            try {
                // Попытка получить ID видео из различных форматов URL
                const patterns = [
                    /(?:vm\.tiktok\.com|vt\.tiktok\.com)\/(\w+)/,
                    /tiktok\.com\/@[\w\.]+\/video\/(\d+)/,
                    /tiktok\.com\/v\/(\d+)/
                ];

                for (let pattern of patterns) {
                    const match = url.match(pattern);
                    if (match) return match[1];
                }
                return null;
            } catch (e) {
                return null;
            }
        }

        // Получение информации о видео
        async function fetchTikTokVideo(url) {
            try {
                downloadBtn.disabled = true;
                const originalText = downloadBtn.innerHTML;
                downloadBtn.innerHTML = '<span class="loader-ring"><div></div><div></div><div></div></span> Загрузка...';

                const response = await fetch(`https://tikwm.com/api/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: `url=${encodeURIComponent(url)}`
                });

                if (!response.ok) {
                    throw new Error('Ошибка при обращении к API');
                }

                const data = await response.json();

                if (!data.code === 0) {
                    throw new Error(data.msg || 'Не удалось получить информацию о видео');
                }

                downloadBtn.innerHTML = originalText;
                downloadBtn.disabled = false;
                return data;
            } catch (error) {
                downloadBtn.disabled = false;
                downloadBtn.innerHTML = originalText;
                showError(error.message);
                hideCards();
                return null;
            }
        }

        // Отображение информации о видео
        function displayVideoInfo(data) {
            if (!data.data) {
                showError('Неправильный формат ответа API');
                hideCards();
                return;
            }

            const videoData = data.data;

            // Информация об авторе
            if (videoData.author) {
                document.getElementById('authorName').textContent = '@' + (videoData.author.unique_id || 'Unknown');
                document.getElementById('authorSignature').textContent = videoData.author.signature || 'No signature';
                if (videoData.author.avatar) {
                    document.getElementById('authorAvatar').src = videoData.author.avatar;
                }
            }

            // Описание видео
            document.getElementById('videoDesc').textContent = videoData.desc || 'No description';

            // Статистика
            document.getElementById('likeCount').textContent = formatNumber(videoData.digg_count || 0);
            document.getElementById('commentCount').textContent = formatNumber(videoData.comment_count || 0);
            document.getElementById('shareCount').textContent = formatNumber(videoData.share_count || 0);

            // Видео плеер
            const playAddress = videoData.play || videoData.downloadAddr;
            if (playAddress) {
                document.getElementById('videoPlayer').src = playAddress;
            }

            // Ссылки для скачивания
            const downloadLinksContainer = document.getElementById('downloadLinks');
            downloadLinksContainer.innerHTML = '';

            const qualities = [
                { name: 'HD Video', url: videoData.downloadAddr || videoData.play, type: 'video' },
                { name: 'SD Video', url: videoData.play, type: 'video' },
            ];

            if (videoData.music && videoData.music.play_url) {
                qualities.push({
                    name: 'Audio (MP3)',
                    url: videoData.music.play_url,
                    type: 'audio'
                });
            }

            qualities.forEach((quality, index) => {
                if (quality.url && quality.url !== 'undefined') {
                    const linkElement = document.createElement('div');
                    linkElement.className = 'download-link';
                    linkElement.innerHTML = `
                        <span>${quality.name}</span>
                        <button class="download-link-btn" onclick="downloadFile('${quality.url}', '${quality.name}')">
                            ⬇ Скачать
                        </button>
                    `;
                    downloadLinksContainer.appendChild(linkElement);
                }
            });

            // Показ карточек
            authorCard.classList.add('active');
            playerCard.classList.add('active');
            showSuccess('Видео загружено успешно! ✨');
        }

        // Скачивание файла
        window.downloadFile = function(url, name) {
            if (!url || url === 'undefined') {
                showError('Ссылка для скачивания недоступна');
                return;
            }

            // Создание ссылки для скачивания
            const a = document.createElement('a');
            a.href = url;
            a.setAttribute('download', name.replace(/\s+/g, '_') + (name.includes('Audio') ? '.mp3' : '.mp4'));
            a.setAttribute('target', '_blank');
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);

            showSuccess(`Скачивание "${name}" начато! 🎉`);
        };

        // Обработчик кнопки загрузки
        downloadBtn.addEventListener('click', async () => {
            const url = videoUrlInput.value.trim();

            if (!url) {
                showError('Пожалуйста, введи ссылку на видео TikTok');
                return;
            }

            if (!url.includes('tiktok.com')) {
                showError('Это не похоже на ссылку TikTok');
                return;
            }

            const data = await fetchTikTokVideo(url);
            if (data && data.code === 0) {
                displayVideoInfo(data);
            }
        });

        // Обработчик Enter на input
        videoUrlInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                downloadBtn.click();
            }
        });

        // Очистка сообщений при вводе
        videoUrlInput.addEventListener('input', () => {
            errorMessage.classList.remove('show');
            successMessage.classList.remove('show');
        });
    </script>
</body>
</html>
